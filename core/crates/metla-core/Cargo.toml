[package]
name = "metla-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Behaviour is tested through the public API in tests/; no unit-test or
# doctest binaries to build per mutant.
test = false
doctest = false

[features]
# Lets a release build of the app make the capability to clean a root that
# is not a fixture. Development builds and the CLI never have it.
production = []

[dependencies]
libc = "0.2"
rayon = "1.12"
# The system libsqlite3 (no `bundled`), no statement cache.
rusqlite = { version = "0.40", default-features = false }

[dev-dependencies]
tempfile = "3"
