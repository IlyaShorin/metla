[workspace]
resolver = "3"
members = ["crates/metla-core", "crates/metla-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# The development machine has little free disk space, and mutation testing
# builds the crate once per worker: no debug info and no incremental cache
# keep every build small.
[profile.dev]
debug = false
incremental = false

[profile.release]
debug = false
